# Wirid for Home Assistant: shared colourful stats dashboard (one file for every phone).
#
# Requires: the Wirid integration (this repo, installed through HACS) and the custom:button-card
# frontend add-on (also HACS). Paste these items under a view's `cards:` (e.g. a "Waktu Solat"
# view), indented to match.
#
# Each card finds the viewer's phone itself: the sensor.<prefix>last_sent entity whose attribute
# wirid_user_id equals the logged-in user's id (with several phones for one user, the newest
# last_sent wins), then reads sensor.<prefix>*. A viewer with no linked phone sees nothing: the
# card is display:none. button-card cannot share a function between pasted cards, so the small
# resolver at the top of each card is repeated byte for byte (it defines `P`, the prefix).
#
# Colours follow the app: emerald up to the daily goal, gold past it, purple past twice; each dhikr
# keeps its app colour; prayer times are gold; up emerald / down rose.

# ---------- 1. Today: tier ring + chips ----------
- type: custom:button-card
  triggers_update: all
  show_name: false
  show_icon: false
  show_state: false
  tap_action: { action: none }
  styles:
    card:
      - display: >
          [[[ const __me = Object.values(states).filter(s => s.entity_id.endsWith('last_sent') && s.attributes && s.attributes.wirid_user_id && s.attributes.wirid_user_id === user.id).sort((a, b) => (Date.parse(b.state) || 0) - (Date.parse(a.state) || 0))[0]; const P = __me ? __me.attributes.wirid_prefix : null; return P ? 'block' : 'none'; ]]]
      - padding: 18px
      - border-radius: 24px
      - background: >
          [[[ const __me = Object.values(states).filter(s => s.entity_id.endsWith('last_sent') && s.attributes && s.attributes.wirid_user_id && s.attributes.wirid_user_id === user.id).sort((a, b) => (Date.parse(b.state) || 0) - (Date.parse(a.state) || 0))[0]; const P = __me ? __me.attributes.wirid_prefix : null; if (!P) return '';
              const n = s => Number((states[s] || {}).state) || 0;
              const t = n(`sensor.${P}today_total`), g = n(`sensor.${P}today_goal`);
              const c = g > 0 && t > 2 * g ? '185,140,255' : g > 0 && t > g ? '255,216,77' : '52,227,160';
              return `radial-gradient(120% 140% at 0% 0%, rgba(${c},0.22) 0%, rgba(${c},0.04) 55%, var(--ha-card-background, var(--card-background-color)) 100%)`; ]]]
    grid:
      - grid-template-areas: '"main"'
  custom_fields:
    main: >
      [[[
        const __me = Object.values(states).filter(s => s.entity_id.endsWith('last_sent') && s.attributes && s.attributes.wirid_user_id && s.attributes.wirid_user_id === user.id).sort((a, b) => (Date.parse(b.state) || 0) - (Date.parse(a.state) || 0))[0]; const P = __me ? __me.attributes.wirid_prefix : null; if (!P) return '';
        const n = s => Number((states[s] || {}).state) || 0;
        const E = '#34E3A0', G = '#FFD84D', P3 = '#B98CFF';
        const total = n(`sensor.${P}today_total`), goal = n(`sensor.${P}today_goal`);
        let lap = 1, frac = 0;
        if (goal > 0) {
          if (total <= goal) frac = total / goal;
          else { lap = Math.ceil(total / goal); frac = (total - (lap - 1) * goal) / goal; }
        }
        const col = lap === 1 ? E : lap === 2 ? G : P3;
        const under = lap === 1 ? null : lap === 2 ? E : lap === 3 ? G : P3;
        const tierName = lap === 1 ? 'On the way' : lap === 2 ? 'Gold' : 'Purple';
        const r = 50, C = 2 * Math.PI * r, dash = (C * Math.min(frac, 1)).toFixed(1);
        const pct = n(`sensor.${P}today_goal_percent`);
        const chip = (icon, text, c) => `<span style="display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:${c}22;color:${c};font-size:12px;font-weight:600">
            <ha-icon icon="${icon}" style="--mdc-icon-size:14px"></ha-icon>${text}</span>`;
        return `
        <div style="display:flex;align-items:center;gap:18px">
          <div style="position:relative;width:124px;height:124px;flex:none">
            <svg viewBox="0 0 124 124" width="124" height="124" style="transform:rotate(-90deg)">
              <circle cx="62" cy="62" r="${r}" fill="none" stroke="${under ? under + '66' : 'rgba(255,255,255,0.08)'}" stroke-width="11"/>
              <circle cx="62" cy="62" r="${r}" fill="none" stroke="${col}" stroke-width="11" stroke-linecap="round"
                      stroke-dasharray="${dash} ${C.toFixed(1)}" style="filter:drop-shadow(0 0 6px ${col}aa)"/>
            </svg>
            <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
              <div style="font-size:30px;font-weight:700;color:var(--primary-text-color);letter-spacing:-1px">${total.toLocaleString()}</div>
              <div style="font-size:11px;color:var(--secondary-text-color)">of ${goal.toLocaleString()}</div>
            </div>
          </div>
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:8px">
            <div style="font-size:13px;color:var(--secondary-text-color);font-weight:600">Wirid today</div>
            <div style="display:flex;align-items:baseline;gap:8px">
              <span style="font-size:26px;font-weight:700;color:${col}">${pct}%</span>
              <span style="font-size:13px;color:${col};font-weight:600">${tierName}${lap > 1 ? ' · lap ' + lap : ''}</span>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:6px">
              ${chip('mdi:fire', n(`sensor.${P}streak_current`) + ' days', '#FF8A4C')}
              ${chip('mdi:trophy-outline', 'best ' + n(`sensor.${P}streak_best`), '#FFD84D')}
              ${chip('mdi:timer-outline', n(`sensor.${P}today_minutes`) + ' min', '#5CC8FF')}
              ${chip('mdi:repeat', n(`sensor.${P}today_sessions`) + ' sessions', '#B48CFF')}
            </div>
          </div>
        </div>`;
      ]]]

# ---------- 2. Each dhikr today: coloured bars ----------
# Lists every dhikr this phone reports (a *_today sensor whose wirid_prefix attribute equals P), so new
# dhikr appear on their own. Colour/monogram come from the sensor; fallback grey + first 2 letters.
- type: custom:button-card
  triggers_update: all
  show_name: false
  show_icon: false
  show_state: false
  tap_action: { action: none }
  styles:
    card:
      - display: >
          [[[ const __me = Object.values(states).filter(s => s.entity_id.endsWith('last_sent') && s.attributes && s.attributes.wirid_user_id && s.attributes.wirid_user_id === user.id).sort((a, b) => (Date.parse(b.state) || 0) - (Date.parse(a.state) || 0))[0]; const P = __me ? __me.attributes.wirid_prefix : null; return P ? 'block' : 'none'; ]]]
      - padding: 16px 18px
      - border-radius: 24px
    grid:
      - grid-template-areas: '"main"'
  custom_fields:
    main: >
      [[[
        const __me = Object.values(states).filter(s => s.entity_id.endsWith('last_sent') && s.attributes && s.attributes.wirid_user_id && s.attributes.wirid_user_id === user.id).sort((a, b) => (Date.parse(b.state) || 0) - (Date.parse(a.state) || 0))[0]; const P = __me ? __me.attributes.wirid_prefix : null; if (!P) return '';
        const n = s => Number((states[s] || {}).state) || 0;
        const dev = ((states[`sensor.${P}last_sent`] || {}).attributes || {}).friendly_name || '';
        const owner = dev.replace(/ Last sent$/, '');
        const list = Object.values(states)
          .filter(s => s.entity_id.endsWith('_today') && s.attributes
                       && s.attributes.slug && s.attributes.wirid_prefix === P)
          .map(s => {
            const a = s.attributes;
            let name = (a.friendly_name || a.slug).replace(/ today$/, '');
            if (owner && name.startsWith(owner + ' ')) name = name.slice(owner.length + 1);
            const c = /^#[0-9a-fA-F]{6}$/.test(a.color || '') ? a.color : '#9AA4B1';
            const m = a.mono || name.replace(/[^\p{L}\p{N}]/gu, '').slice(0, 2).toUpperCase();
            return { name, c, m, today: Number(s.state) || 0,
                     all: n(a.all_time_entity || `sensor.${P}${a.slug}_all_time`) };
          })
          .sort((a, b) => b.today - a.today || b.all - a.all);
        const max = Math.max(1, ...list.map(d => d.today));
        const rows = list.map(d => `
          <div style="display:flex;align-items:center;gap:10px;opacity:${d.today ? 1 : 0.45}">
            <div style="width:28px;height:28px;border-radius:50%;background:${d.c};color:#06140F;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none">${d.m}</div>
            <div style="flex:1;min-width:0">
              <div style="display:flex;justify-content:space-between;font-size:13px">
                <span style="color:var(--primary-text-color);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${d.name}</span>
                <span style="color:var(--primary-text-color);font-weight:700">${d.today.toLocaleString()}</span>
              </div>
              <div style="height:6px;border-radius:3px;background:rgba(255,255,255,0.07);margin-top:4px">
                <div style="height:6px;border-radius:3px;width:${(d.today / max * 100).toFixed(1)}%;background:linear-gradient(90deg, ${d.c}99, ${d.c})"></div>
              </div>
              <div style="font-size:11px;color:var(--secondary-text-color);margin-top:2px">${d.all.toLocaleString()} all time</div>
            </div>
          </div>`).join('');
        return `<div style="font-size:15px;font-weight:700;color:var(--primary-text-color);margin-bottom:12px">Each dhikr today</div>
                <div style="display:flex;flex-direction:column;gap:10px">${rows}</div>`;
      ]]]

# ---------- 3. By prayer time: gold columns ----------
- type: custom:button-card
  triggers_update: all
  show_name: false
  show_icon: false
  show_state: false
  tap_action: { action: none }
  styles:
    card:
      - display: >
          [[[ const __me = Object.values(states).filter(s => s.entity_id.endsWith('last_sent') && s.attributes && s.attributes.wirid_user_id && s.attributes.wirid_user_id === user.id).sort((a, b) => (Date.parse(b.state) || 0) - (Date.parse(a.state) || 0))[0]; const P = __me ? __me.attributes.wirid_prefix : null; return P ? 'block' : 'none'; ]]]
      - padding: 16px 18px
      - border-radius: 24px
    grid:
      - grid-template-areas: '"main"'
  custom_fields:
    main: >
      [[[
        const __me = Object.values(states).filter(s => s.entity_id.endsWith('last_sent') && s.attributes && s.attributes.wirid_user_id && s.attributes.wirid_user_id === user.id).sort((a, b) => (Date.parse(b.state) || 0) - (Date.parse(a.state) || 0))[0]; const P = __me ? __me.attributes.wirid_prefix : null; if (!P) return '';
        const n = s => Number((states[s] || {}).state) || 0;
        const w = [['Sbh','subuh'],['Syk','syuruk'],['Dhu','dhuha'],['Zwl','zawal'],['Zhr','zohor'],
                   ['Asr','asar'],['Mgb','maghrib'],['Isy','isyak'],['Thj','tahajjud']]
          .map(([l, k]) => ({ l, v: n(`sensor.${P}today_${k}`), night: k === 'isyak' || k === 'tahajjud' }));
        const max = Math.max(1, ...w.map(x => x.v));
        const top = w.reduce((a, b) => b.v > a.v ? b : a, w[0]);
        const cols = w.map(x => {
          const h = x.v ? Math.max(6, x.v / max * 90) : 4;
          const c = x.night ? '#8C9CFF' : '#FFC93C';
          return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
              <div style="font-size:10px;color:var(--secondary-text-color);height:12px">${x.v ? x.v.toLocaleString() : ''}</div>
              <div style="height:90px;display:flex;align-items:flex-end;width:100%;justify-content:center">
                <div style="width:70%;max-width:22px;height:${h}px;border-radius:6px;background:${x.v ? `linear-gradient(180deg, ${c}, ${c}66)` : 'rgba(255,255,255,0.08)'};${x === top && x.v ? `box-shadow:0 0 10px ${c}88` : ''}"></div>
              </div>
              <div style="font-size:11px;color:${x === top && x.v ? c : 'var(--secondary-text-color)'};font-weight:${x === top && x.v ? 700 : 500}">${x.l}</div>
            </div>`;
        }).join('');
        return `<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
                  <span style="font-size:15px;font-weight:700;color:var(--primary-text-color)">By prayer time</span>
                  <span style="font-size:12px;color:#FFC93C;font-weight:600">${top.v ? 'Most at ' + top.l : 'Nothing yet today'}</span>
                </div>
                <div style="display:flex;gap:2px">${cols}</div>`;
      ]]]

# ---------- 4. Periods: totals with up/down pills ----------
- type: custom:button-card
  triggers_update: all
  show_name: false
  show_icon: false
  show_state: false
  tap_action: { action: none }
  styles:
    card:
      - display: >
          [[[ const __me = Object.values(states).filter(s => s.entity_id.endsWith('last_sent') && s.attributes && s.attributes.wirid_user_id && s.attributes.wirid_user_id === user.id).sort((a, b) => (Date.parse(b.state) || 0) - (Date.parse(a.state) || 0))[0]; const P = __me ? __me.attributes.wirid_prefix : null; return P ? 'block' : 'none'; ]]]
      - padding: 16px 18px
      - border-radius: 24px
    grid:
      - grid-template-areas: '"main"'
  custom_fields:
    main: >
      [[[
        const __me = Object.values(states).filter(s => s.entity_id.endsWith('last_sent') && s.attributes && s.attributes.wirid_user_id && s.attributes.wirid_user_id === user.id).sort((a, b) => (Date.parse(b.state) || 0) - (Date.parse(a.state) || 0))[0]; const P = __me ? __me.attributes.wirid_prefix : null; if (!P) return '';
        const st = s => (states[s] || {}).state;
        const n = s => Number(st(s)) || 0;
        const tile = (label, k, sub) => {
          const ch = st(`sensor.${P}${k}_change`);
          const has = ch !== undefined && ch !== 'unavailable' && ch !== 'unknown' && !isNaN(Number(ch));
          const v = Number(ch), up = v >= 0, c = up ? '#34E3A0' : '#FF6B86';
          const pill = has ? `<span style="padding:2px 8px;border-radius:999px;background:${c}22;color:${c};font-size:11px;font-weight:700">${up ? '▲' : '▼'} ${Math.abs(v)}%</span>` : '';
          return `<div style="flex:1;min-width:0;padding:12px;border-radius:16px;background:rgba(255,255,255,0.04)">
              <div style="font-size:12px;color:var(--secondary-text-color);font-weight:600">${label}</div>
              <div style="font-size:22px;font-weight:700;color:var(--primary-text-color);margin:4px 0 6px">${n(`sensor.${P}${k}_total`).toLocaleString()}</div>
              ${pill}<div style="font-size:10px;color:var(--secondary-text-color);margin-top:4px">${sub}</div>
            </div>`;
        };
        return `<div style="font-size:15px;font-weight:700;color:var(--primary-text-color);margin-bottom:10px">Periods</div>
                <div style="display:flex;gap:8px">
                  ${tile('7 days', 'week', 'vs 7 days before')}
                  ${tile('Month', 'month', 'vs same days last month')}
                  ${tile('Year', 'year', 'vs same days last year')}
                </div>`;
      ]]]

# ---------- 5. Last 14 days: stacked by dhikr ----------
# Follows the viewer like the other cards (no user id to edit). The phone sends the last 14 days per
# dhikr (Wirid app 0.3.0+ with integration 0.2.0+); an older app shows a short note instead.
- type: custom:button-card
  triggers_update: all
  show_name: false
  show_icon: false
  show_state: false
  tap_action: { action: none }
  styles:
    card:
      - display: >
          [[[ const __me = Object.values(states).filter(s => s.entity_id.endsWith('last_sent') && s.attributes && s.attributes.wirid_user_id && s.attributes.wirid_user_id === user.id).sort((a, b) => (Date.parse(b.state) || 0) - (Date.parse(a.state) || 0))[0]; const P = __me ? __me.attributes.wirid_prefix : null; return P ? 'block' : 'none'; ]]]
      - padding: 16px 18px
      - border-radius: 24px
    grid:
      - grid-template-areas: '"main"'
  custom_fields:
    main: >
      [[[
        const __me = Object.values(states).filter(s => s.entity_id.endsWith('last_sent') && s.attributes && s.attributes.wirid_user_id && s.attributes.wirid_user_id === user.id).sort((a, b) => (Date.parse(b.state) || 0) - (Date.parse(a.state) || 0))[0]; const P = __me ? __me.attributes.wirid_prefix : null; if (!P) return '';
        const dates = (__me.attributes.days || []);
        const head = `<div style="font-size:15px;font-weight:700;color:var(--primary-text-color)">Last 14 days</div>`;
        if (!dates.length) return head + `<div style="font-size:12px;color:var(--secondary-text-color);margin-top:6px">Update the Wirid app on the phone to see this chart.</div>`;
        const owner = (__me.attributes.friendly_name || '').replace(/ Last sent$/, '');
        const list = Object.values(states)
          .filter(s => s.entity_id.endsWith('_today') && s.attributes && s.attributes.slug && s.attributes.wirid_prefix === P)
          .map(s => {
            const a = s.attributes;
            let name = (a.friendly_name || a.slug).replace(/ today$/, '');
            if (owner && name.startsWith(owner + ' ')) name = name.slice(owner.length + 1);
            const c = /^#[0-9a-fA-F]{6}$/.test(a.color || '') ? a.color : '#9AA4B1';
            const days = dates.map((_, i) => Array.isArray(a.days) ? (Number(a.days[i]) || 0) : 0);
            return { name, c, days, sum: days.reduce((x, y) => x + y, 0) };
          })
          .filter(d => d.sum > 0)
          .sort((a, b) => b.sum - a.sum);
        const totals = dates.map((_, i) => list.reduce((t, d) => t + d.days[i], 0));
        const all = totals.reduce((x, y) => x + y, 0);
        const max = Math.max(1, ...totals);
        const H = 110;
        const cols = dates.map((ds, i) => {
          const dt = new Date(ds + 'T00:00:00');
          const last = i === dates.length - 1;
          const segs = list.filter(d => d.days[i] > 0).map(d =>
            `<div title="${d.name}: ${d.days[i]}" style="height:${(d.days[i] / max * H).toFixed(1)}px;background:${d.c}"></div>`).join('');
          return `<div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px">
              <div style="font-size:9px;color:var(--secondary-text-color);height:11px;white-space:nowrap">${totals[i] ? totals[i].toLocaleString() : ''}</div>
              <div style="height:${H}px;width:100%;display:flex;align-items:flex-end;justify-content:center">
                <div style="width:72%;max-width:18px;display:flex;flex-direction:column-reverse;border-radius:5px;overflow:hidden;${totals[i] ? '' : 'height:3px;background:rgba(255,255,255,0.08)'}">${segs}</div>
              </div>
              <div style="font-size:10px;line-height:1.1;text-align:center;color:${last ? 'var(--primary-text-color)' : 'var(--secondary-text-color)'};font-weight:${last ? 700 : 500}">${'SMTWTFS'[dt.getDay()]}<br>${dt.getDate()}</div>
            </div>`;
        }).join('');
        const legend = list.map(d => `<span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--secondary-text-color)">
            <span style="width:9px;height:9px;border-radius:50%;background:${d.c}"></span>${d.name} <b style="color:var(--primary-text-color)">${d.sum.toLocaleString()}</b></span>`).join('');
        return `<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">${head}
                  <span style="font-size:12px;color:var(--secondary-text-color)">${all.toLocaleString()} · ${Math.round(all / dates.length).toLocaleString()}/day</span></div>
                <div style="display:flex;gap:2px">${cols}</div>
                <div style="display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px">${legend || '<span style="font-size:11px;color:var(--secondary-text-color)">No dhikr in these 14 days yet</span>'}</div>`;
      ]]]

# ---------- 6. Footer: active days, last session, last sent ----------
- type: custom:button-card
  triggers_update: all
  show_name: false
  show_icon: false
  show_state: false
  tap_action: { action: none }
  styles:
    card:
      - display: >
          [[[ const __me = Object.values(states).filter(s => s.entity_id.endsWith('last_sent') && s.attributes && s.attributes.wirid_user_id && s.attributes.wirid_user_id === user.id).sort((a, b) => (Date.parse(b.state) || 0) - (Date.parse(a.state) || 0))[0]; const P = __me ? __me.attributes.wirid_prefix : null; return P ? 'block' : 'none'; ]]]
      - padding: 14px 18px
      - border-radius: 24px
    grid:
      - grid-template-areas: '"main"'
  custom_fields:
    main: >
      [[[
        const __me = Object.values(states).filter(s => s.entity_id.endsWith('last_sent') && s.attributes && s.attributes.wirid_user_id && s.attributes.wirid_user_id === user.id).sort((a, b) => (Date.parse(b.state) || 0) - (Date.parse(a.state) || 0))[0]; const P = __me ? __me.attributes.wirid_prefix : null; if (!P) return '';
        const n = e => Number((states[e] || {}).state) || 0;
        const s = states[`sensor.${P}last_session`] || { state: '', attributes: {} };
        const ended = s.attributes.ended ? new Date(s.attributes.ended) : null;
        const sent = __me ? new Date(__me.state) : null;
        const t = d => d && !isNaN(d) ? d.toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' }) : '—';
        const item = (icon, c, big, small) => `<div style="flex:1;min-width:0;display:flex;align-items:center;gap:10px">
            <div style="width:34px;height:34px;border-radius:12px;background:${c}22;color:${c};display:flex;align-items:center;justify-content:center;flex:none">
              <ha-icon icon="${icon}" style="--mdc-icon-size:18px"></ha-icon></div>
            <div style="min-width:0"><div style="font-size:15px;font-weight:700;color:var(--primary-text-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${big}</div>
            <div style="font-size:11px;color:var(--secondary-text-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${small}</div></div></div>`;
        return `<div style="display:flex;gap:12px">
            ${item('mdi:calendar-check', '#34E3A0', n(`sensor.${P}active_days`).toLocaleString() + ' days', 'active')}
            ${item('mdi:history', '#5CC8FF', s.state && s.state !== 'unavailable' ? Number(s.state).toLocaleString() + ' · ' + (s.attributes.routine || '') : '—', 'last session ' + t(ended))}
          </div>
          <div style="font-size:10px;color:var(--secondary-text-color);text-align:right;margin-top:8px">Synced ${t(sent)}</div>`;
      ]]]
